name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI panic is worth more than the noise it costs.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the fixture writers
        # The spreadsheet fixtures are generated, not committed by hand.
        # xlwt is the only pure-Python BIFF8 writer, so it is what gives the
        # legacy .xls path a fixture; the .ods files need no library.
        # lxml matters even though nothing imports it: openpyxl serialises
        # through it when present and through ElementTree when not, and the
        # two differ (`<tag/>` vs `<tag />`). Without it CI regenerates every
        # .xlsx to different bytes than the committed ones.
        run: pip install --quiet openpyxl xlwt lxml

      - name: Regenerate every fixture
        # Proves the generators still run and still produce what the tests
        # expect. Byte-equality against the *committed* files is deliberately
        # not asserted: zlib and lxml differ across platforms, and that would
        # make CI red for reasons that are not defects.
        run: python3 gen_fixtures.py

      - name: Regeneration is idempotent
        # A generator that stamps a wall clock produces a different file every
        # run, which stales the blake3 fingerprint in every sidecar pointing
        # at it. Comparing a run against the run before it catches that
        # without depending on the platform. Two generators had this bug.
        run: |
          set -euo pipefail
          hash_fixtures() {
            find testdata -type f ! -name '*.tdy.toml' -print0 \
              | sort -z | xargs -0 sha256sum
          }
          hash_fixtures > /tmp/fixtures.before
          python3 gen_fixtures.py > /dev/null
          hash_fixtures > /tmp/fixtures.after
          diff /tmp/fixtures.before /tmp/fixtures.after \
            || { echo "::error::fixture generation is not deterministic"; exit 1; }
          echo "all fixtures regenerate byte-identically"

      - name: Build
        # --workspace, or the terminal UI silently stops being built: in a
        # workspace with a root package, cargo's default is the root package
        # alone.
        run: cargo build --locked --workspace --all-targets

      - name: Test
        # --lib --tests rather than a bare `cargo test`: there are no
        # doc-tests to speak of, and this is the invocation the docs give.
        run: cargo test --locked --workspace --lib --tests

      - name: Clippy
        # Formatting is deliberately not gated: this codebase has never been
        # through rustfmt, and adding it would bury the code under a
        # mechanical reformat. `cargo fmt --all` any time you want it.
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  deny:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories, bans and sources only — deny.toml says why licenses are
      # not gated. This is the job that catches the next RUSTSEC advisory in
      # reqwest/zip/quick-xml/calamine, which is where they appear for a tool
      # that parses untrusted files; it found two real quick-xml DoS
      # advisories the day it was added.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  msrv:
    name: minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # A check, not a test run: this job exists to keep the declared
      # rust-version honest, not to run the suite twice. It has already
      # earned its place twice over — the README claimed 1.81, and the real
      # floor turned out to be 1.88 (icu_* via reqwest -> url -> idna).
      - run: cargo check --locked --workspace --all-targets

  reproducible:
    name: --frozen is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install --quiet openpyxl xlwt lxml
      - run: python3 gen_fixtures.py
      - run: cargo build --locked --release

      - name: Same file, same spec, same bytes
        # The promise a sidecar makes, exercised end to end: infer once, then
        # run the same query twice in frozen mode and diff the output.
        run: |
          set -euo pipefail
          T=./target/release/tdy
          F=testdata/csv_torture/csv_torture_bom_crlf.csv
          "$T" sniff "$F" --no-llm > /dev/null
          SQL="SELECT * FROM messy('$F') ORDER BY 1"
          "$T" query "$SQL" -f -o a.csv
          "$T" query "$SQL" -f -o b.csv
          diff a.csv b.csv
          test -s a.csv
          echo "frozen output is byte-identical across runs"
