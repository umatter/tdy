[package]
name = "tdy"
version = "0.1.0"
edition = "2021"
# Set by the dependency tree, not by this crate's own code: reqwest pulls in
# url -> idna -> icu_*, which require 1.88. CI checks this against the
# committed lockfile rather than trusting it.
rust-version = "1.88"
description = "SQL over messy files: heuristic + LLM-inferred parsing specs, DataFusion execution, tidy Arrow/Parquet out"
license = "MIT"
repository = "https://github.com/umatter/tdy"
readme = "README.md"
keywords = ["sql", "csv", "excel", "data-cleaning", "datafusion"]
categories = ["command-line-utilities", "parsing"]
# The published package is the code, not the 16 MB test corpus: fixtures are
# regenerated by gen_fixtures.py, and `cargo test` on the package alone is not
# a supported workflow (clone the repository for that).
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
datafusion = "46"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
# For the lazy table provider: adapting a producer thread into a RecordBatch stream.
futures = "0.3"
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "0.8"

clap = { version = "4", features = ["derive"] }
anyhow = "1"

csv = "1.3"
calamine = { version = "0.36", features = ["dates"] }
# Direct deps only so spreadsheet containers can be *bounded before* calamine
# allocates a grid from them; versions match calamine's own so the tree does
# not build two copies. See src/xlguard.rs.
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
regex = "1"
chrono = "0.4"
encoding_rs = "0.8"
chardetng = "0.1"
blake3 = "1"
dirs = "5"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

# One shared vCPU in typical CI-ish environments: skip debuginfo for a much
# faster and smaller build. Flip to `debug = true` when you need a debugger.
[profile.dev]
debug = false

# A workspace with the CLI at its root and the terminal UI beside it: ratatui
# and crossterm are the TUI's business, and keeping them out of `tdy`'s
# dependency tree is what keeps the published crate (and its build) small.
[workspace]
members = [".", "tdy-tui"]
